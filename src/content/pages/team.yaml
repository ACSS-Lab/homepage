# Wording of the Team page (/team/).
# The people themselves are in src/content/team/.

page: team
title: Team # browser tab title

hero:
  title: Team

pageSize: 4 # member cards loaded at a time while scrolling (2-12)

# Filter sidebar on the "Current Members" tab
filters:
  title: Current Members
  searchPlaceholder: Search name, topic
  degree: Degree
  topic: Area of research interest
  empty: No members match this topic.

# Section headings on the "Current Members" tab, in display order.
roles:
  postdoc: Postdoctoral Researchers
  phd: Ph.D. Students
  ms: M.S. Students

# Section headings on the "Alumni" tab.
degrees:
  PhD: Ph.D. Alumni
  MS: M.S. Alumni
degreeTitles:
  PhD: Doctoral Student
  MS: Master's Student

labels:
  representative: Lab Representative
  researchInterest: Research interest
  currentAffiliation: Current affiliation
  # Join date on a member card. {date} is replaced with e.g. "Feb 2025".
  joined: "{date} –"
  incoming: Incoming {date}
  # Term names for interns
  terms:
    spring: Spring
    summer: Summer
    fall: Fall
    winter: Winter

interns:
  title: Interns
  empty: No interns at the moment. # shown when nobody is a current intern
  # Sub-headings on the "Interns" tab, in display order.
  kinds:
    research: Research Interns
    undergraduate: Undergraduate Interns
  # Collapsed list under the current interns: everyone whose file says `alumni: true`.
  alumni:
    title: Alumni

alumni:
  title: Alumni
  note: Current affiliations are updated after confirmation with each alum.

# Banner under the lists (not shown on the Alumni tab)
join:
  title: We're looking for people to research with
  body: We recruit MS/PhD students and undergraduate interns. Reach out with your CV and the topics you'd like to work on.
  cta: How to apply
  href: /contact/
