# Builds the site and publishes dist/ to GitHub Pages on every push to main.
# The repository's Pages source must be "GitHub Actions" (Settings > Pages).
# The custom domain is stored in those settings; public/CNAME only mirrors it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a maintainer re-run the deploy from the Actions tab.
  workflow_dispatch:

# Least privilege by default; the deploy job adds what Pages needs.
permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      # The same three gates as the definition of done in CLAUDE.md.
      # A failure here stops the deploy and the live site stays as it was.
      - name: Build (schema and cross-file checks)
        run: npm run build

      - name: Type check
        run: npm run check

      - name: Project rules
        run: npm run guard

      - name: Upload dist/ as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
